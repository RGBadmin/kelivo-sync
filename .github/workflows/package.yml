name: Package and Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath kelivo-sync-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-sync-windows-x64
          path: kelivo-sync-windows-x64.zip

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "kelivo-sync-$abi.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-sync-android-apks
          path: build/app/outputs/flutter-apk/kelivo-sync-*.apk

  release:
    name: Publish Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kelivo Sync ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})
          body: |
            自动构建的最新版本。
            - `kelivo-sync-windows-x64.zip`：Windows 桌面版，解压运行 kelivo.exe
            - `kelivo-sync-arm64-v8a.apk`：安卓（现代手机装这个）
            - `kelivo-sync-armeabi-v7a.apk`：安卓 32 位老设备
            - `kelivo-sync-x86_64.apk`：安卓模拟器
            包名 com.psyche.kelivo.sync，可与官方版 Kelivo 共存安装。
          files: artifacts/*
